[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abr"
version = "0.1.0"
description = "Accessible Book Reader prototype pipeline"
readme = "readme.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ocr-paddle = ["paddleocr>=2.7"]
ocr-rapidocr = ["rapidocr>=3.4,<4", "onnxruntime"]
ocr-tesseract = ["pytesseract>=0.3.10"]
tts-google = ["google-auth>=2.0", "requests>=2.31"]
nfc-pn532 = ["pyserial>=3.5"]
tts = []
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["abr*"]
